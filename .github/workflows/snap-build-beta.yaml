name: Beta Snap Build

on:
  push:
    branches: [main]
    paths: ['snap/snapcraft.yaml']
  workflow_dispatch:

jobs:
  build_snap:
    name: Build beta rustfs snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        uses: canonical/action-build@v1
        id: build-snap
        with:
          build-info: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-snap-${{ matrix.arch }}
          path: ${{ steps.build-snap.outputs.snap }}

      - name: Smoke test
        run: |
          sudo snap install --dangerous ${{ steps.build-snap.outputs.snap }}
          snap run rustfs --version
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:9000/health && exit 0
            sleep 2
          done
          sudo snap logs -n 50 rustfs
          exit 1

      - name: Publish to Beta
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: beta
